<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Principal · iLabPharma Nova Versão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="prototipo.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="principal.css">
</head>
<body class="p-body">
<div class="p-app" id="app">
  <aside class="p-side" id="lateral" aria-label="Menu lateral">
    <a class="p-marca" href="#inicio" aria-label="iLabPharma, início">
      <span class="p-marca-icone" aria-hidden="true">i</span>
      <span class="p-marca-texto"><strong>i<span>Lab</span>Pharma</strong><small>NOVA VERSÃO</small></span>
    </a>
    <nav id="menu" class="p-nav" aria-label="Menu do Principal"></nav>
    <div class="p-side-rodape">
      <span class="p-avatar" aria-hidden="true">CM</span>
      <span class="p-side-quem"><strong>Carla Mendes</strong><small>Administrador</small></span>
    </div>
  </aside>
  <div class="p-fundo-menu" id="fundo-menu" hidden></div>

  <div class="p-corpo">
    <header class="p-barra">
      <button type="button" class="p-icone-btn" id="hamburguer" aria-label="Recolher ou abrir o menu" aria-controls="lateral" aria-expanded="true"></button>
      <button type="button" class="p-busca" id="abre-busca" aria-haspopup="dialog">
        <span class="p-busca-lupa" aria-hidden="true"></span>
        <span class="p-busca-texto">Pesquisar cadastros, módulos…</span>
        <kbd>Ctrl + K</kbd>
      </button>
      <div class="p-barra-dir">
        <button type="button" class="p-icone-btn" data-theme-toggle aria-label="Alternar tema claro e escuro" id="b-tema"></button>
        <div class="p-menu-pop">
          <button type="button" class="p-icone-btn" id="b-sino" aria-haspopup="true" aria-expanded="false" aria-controls="pop-sino" aria-label="Notificações, 3 novas"><span class="p-ponto" aria-hidden="true">3</span></button>
          <div class="p-pop" id="pop-sino" hidden>
            <h2>Notificações</h2>
            <ul id="lista-sino"></ul>
            <p class="p-pop-rodape">Dados fictícios.</p>
          </div>
        </div>
        <div class="p-menu-pop">
          <button type="button" class="p-avatar-btn" id="b-avatar" aria-haspopup="true" aria-expanded="false" aria-controls="pop-avatar">
            <span class="p-avatar" aria-hidden="true">CM</span>
            <span class="p-avatar-txt"><strong>Carla Mendes</strong><small>Administrador</small></span>
            <span class="p-chevron" aria-hidden="true"></span>
          </button>
          <div class="p-pop p-pop-avatar" id="pop-avatar" hidden>
            <a href="seguranca.html">Minha segurança</a>
            <div class="field p-ver-como"><label for="papel">Ver como (só no protótipo)</label>
              <select id="papel" class="input"><option value="admin">Administrador</option><option value="analista">Analista (sem função de restaurar)</option></select></div>
            <a href="entrar.html">Sair</a>
          </div>
        </div>
      </div>
    </header>
    <main id="conteudo" class="p-main" tabindex="-1"></main>
  </div>
</div>

<div class="p-busca-fundo" id="busca-fundo" hidden role="dialog" aria-modal="true" aria-label="Pesquisa">
  <div class="p-busca-caixa">
    <div class="p-busca-topo"><span class="p-busca-lupa" aria-hidden="true"></span><input id="busca-global" type="search" autocomplete="off" placeholder="Digite o nome de um cadastro ou uma ação" aria-controls="busca-lista"><kbd>ESC</kbd></div>
    <ul id="busca-lista" class="p-busca-lista" role="listbox"></ul>
  </div>
</div>

<div class="modal-fundo" id="m-form" hidden role="dialog" aria-modal="true" aria-labelledby="m-form-t">
  <div class="modal larga">
    <h2 id="m-form-t"></h2>
    <p class="sub-modal" id="m-form-sub"></p>
    <div id="m-form-msg" role="alert" aria-live="assertive"></div>
    <form id="f-form" novalidate>
      <div id="f-campos"></div>
      <div class="field" id="f-motivo-bloco"><label for="f-motivo">Motivo da mudança (obrigatório)</label><textarea id="f-motivo" class="input" placeholder="Ex.: correção de cadastro após conferência"></textarea></div>
      <div class="acoes"><button type="submit" class="btn primary">Salvar</button> <button type="button" class="btn" data-fechar="m-form">Cancelar</button></div>
    </form>
  </div>
</div>
<div class="modal-fundo" id="m-sit" hidden role="dialog" aria-modal="true" aria-labelledby="m-sit-t">
  <div class="modal larga">
    <h2 id="m-sit-t"></h2>
    <p class="sub-modal" id="m-sit-sub"></p>
    <div id="m-sit-msg" role="alert" aria-live="assertive"></div>
    <form id="f-sit" novalidate>
      <div class="field"><label for="s-motivo">Motivo (obrigatório)</label><textarea id="s-motivo" class="input"></textarea></div>
      <div class="acoes"><button type="submit" class="btn primary">Confirmar</button> <button type="button" class="btn" data-fechar="m-sit">Cancelar</button></div>
    </form>
  </div>
</div>
<div class="modal-fundo" id="m-hist" hidden role="dialog" aria-modal="true" aria-labelledby="m-hist-t">
  <div class="modal larga">
    <h2 id="m-hist-t">Histórico</h2>
    <div id="m-hist-corpo"></div>
    <div class="acoes"><button type="button" class="btn" data-fechar="m-hist">Fechar</button></div>
  </div>
</div>
<div id="aviso" class="toast" role="status" aria-live="polite" hidden></div>
<script src="common.js"></script>
<script src="principal-dados.js"></script>
<script src="principal.js"></script>
</body>
</html>
